name: 'retail_analytics'
version: '1.0.0'
config-version: 2

profile: 'retail_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  retail_analytics:
    # Default materialization for all models
    +materialized: view
    
    staging:
      +materialized: view
      +schema: staging
    
    marts:
      +materialized: table
      # DO NOT specify a schema here - let it use the default dataset
      
      core:
        +materialized: table
        # No schema override - uses default 'retail_analytics'
      
      analytics:
        +materialized: view
        # No schema override - uses default 'retail_analytics'